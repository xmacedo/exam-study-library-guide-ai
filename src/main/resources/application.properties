spring.application.name=exam-study-library-guide-ai

# Server Configuration
server.port=8080

# Ollama Configuration
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=qwen2.5:32b
spring.ai.ollama.chat.options.temperature=0.3
spring.ai.ollama.embedding.options.model=nomic-embed-text

# Logging Configuration
logging.level.org.springframework.ai=DEBUG
logging.level.com.examstudylibraryguideai=DEBUG

# Document Processing
app.documents.path=./src/main/resources/documents
app.exams.path=./src/main/resources/data/exam.json
app.documents.patterns=*.md